        src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="106" fill="#1c1917"/><path d="M106 256 L186 256 L213 186 L266 346 L306 240 L340 280 L406 280" stroke="#10b981" stroke-width="21" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
        sizes: "512x512",
        type: "image/svg+xml"
      }]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>

  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);

  }, [name, className, strokeWidth]);

const STORAGE_KEY = 'labs:v1';
const CUSTOM_GROUPS_KEY = 'labs:customGroups:v1';

const flagStatus = (value, lowOrTest, high) => {
  // Backward compat: if called with (value, test), use test.qualitative; else (value, low, high)
  let low;
  let test = null;
  if (lowOrTest && typeof lowOrTest === 'object') {
    test = lowOrTest;
    low = test.low;
    high = test.high;
  } else {
    low = lowOrTest;
  }
  if (test?.qualitative) {
    const q = qualStatus(test, value);
    return q || 'normal';
  }
  if (value === null || value === undefined || value === '') return 'normal';
  const v = parseFloat(value);
  if (isNaN(v)) return 'normal';
  if (low !== null && low !== undefined && v < low) return 'low';
  if (high !== null && high !== undefined && v > high) return 'high';
  return 'normal';
};

const fmtDate = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
};

const fmtDateShort = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short' });
};

const ALL_TESTS = Object.entries(PANELS).flatMap(([panelKey, panel]) =>
  panel.tests.map(t => ({ ...t, panelKey, panelLabel: panel.label }))
);

const findTest = (key) => ALL_TESTS.find(t => t.key === key);

// Qualitative label schemes — { positive_label, negative_label, positive_is_concerning }
const QUALITATIVE_SCHEMES = {
  detected:  { pos: 'Detected',     neg: 'Not Detected', positiveIsConcerning: true },
  growth:    { pos: 'Growth',       neg: 'No Growth',    positiveIsConcerning: true },
  positive:  { pos: 'Positive',     neg: 'Negative',     positiveIsConcerning: true },
  immunity:  { pos: 'Immune',       neg: 'Non-immune',   positiveIsConcerning: false },
};

const formatValue = (test, value) => {
  if (value === null || value === undefined || value === '') return '—';
  if (!test?.qualitative) return value;
  const scheme = QUALITATIVE_SCHEMES[test.qualitative];
  if (!scheme) return value;
  const v = parseFloat(value);
  return v >= 0.5 ? scheme.pos : scheme.neg;
};

// Status for qualitative tests: positiveIsConcerning ? high : low (when present);
// negativeIsConcerning (immunity) → low when value=0
const qualStatus = (test, value) => {
  if (!test?.qualitative) return null;
  const scheme = QUALITATIVE_SCHEMES[test.qualitative];
  if (!scheme) return null;
  const v = parseFloat(value);
  if (isNaN(v)) return 'normal';
  if (scheme.positiveIsConcerning) {
    return v >= 0.5 ? 'high' : 'normal';
  } else {
    // Immunity: detected = good, not detected = concerning
    return v >= 0.5 ? 'normal' : 'low';
  }
};

// LocalStorage helpers
const loadEntries = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
};
const saveEntries = (entries) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch {}
};

// =====================================================================
// MAIN APP
// =====================================================================
function LabTracker() {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('dashboard');
  const [selectedTest, setSelectedTest] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('labs:theme') || 'light'; } catch { return 'light'; }
  });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') root.classList.add('dark');
    else root.classList.remove('dark');
    try { localStorage.setItem('labs:theme', theme); } catch {}
  }, [theme]);

  useEffect(() => {
    const loaded = loadEntries();
    loaded.sort((a, b) => new Date(a.date) - new Date(b.date));
    setEntries(loaded);
    setLoading(false);
  }, []);

  // ─── Back button / browser history integration ──────────────────────
  // We push a history entry every time view/selectedTest change.
  // popstate restores the previous state instead of closing the PWA.
  const isPoppingRef = useRef(false);

  // Seed initial history state on mount so back from the first screen exits
  useEffect(() => {
    if (!window.history.state || !window.history.state.appState) {
      window.history.replaceState({ appState: { view: 'dashboard', selectedTest: null } }, '');
    }
    const onPop = (e) => {
      const s = e.state?.appState;
      isPoppingRef.current = true;
      if (s) {
        setView(s.view);
        setSelectedTest(s.selectedTest);
      } else {
        // No app state in history — go to dashboard rather than closing
        setView('dashboard');
        setSelectedTest(null);
      }
      // Release the flag after React processes the state change
      setTimeout(() => { isPoppingRef.current = false; }, 0);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  // Push history state whenever the navigation state changes (not when popping)
  useEffect(() => {
    if (isPoppingRef.current) return;
    const current = window.history.state?.appState;
    if (current && current.view === view && current.selectedTest === selectedTest) return;
    window.history.pushState({ appState: { view, selectedTest } }, '');
  }, [view, selectedTest]);

  const persist = (next) => {
    const sorted = [...next].sort((a, b) => new Date(a.date) - new Date(b.date));
    setEntries(sorted);
    saveEntries(sorted);
  };

  const addEntry = (entry) => {
    persist([...entries, { ...entry, id: Date.now() + Math.random() }]);
  };
  const deleteEntry = (id) => persist(entries.filter(e => e.id !== id));

  const allResults = useMemo(() => {
    const arr = [];
    entries.forEach(entry => {
      Object.entries(entry.results || {}).forEach(([testKey, value]) => {
        if (value === '' || value === null || value === undefined) return;
        const test = findTest(testKey);
        if (!test) return;
        arr.push({
          entryId: entry.id, date: entry.date, lab: entry.lab, notes: entry.notes,
          testKey, test, value: parseFloat(value),
          status: flagStatus(value, test),
        });
      });
    });
    return arr.sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [entries]);

  const activeTests = useMemo(() => {
    const map = new Map();
    allResults.forEach(r => {
      const existing = map.get(r.testKey);
      if (!existing || new Date(r.date) > new Date(existing.date)) map.set(r.testKey, r);
    });
    return Array.from(map.values()).sort((a, b) =>
      a.test.panelLabel.localeCompare(b.test.panelLabel) || a.test.name.localeCompare(b.test.name)
    );
  }, [allResults]);

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-stone-400 font-mono-tag text-sm">loading…</div>;
  }

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <header className="border-b border-stone-200 bg-white sticky top-0 z-40">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg bg-stone-900 flex items-center justify-center">
              <Icon name="activity" className="w-5 h-5 text-emerald-400" strokeWidth={2.5} />
            </div>
            <div>
              <div className="font-bold text-base tracking-tight font-serif-display">Pathology Tracker</div>
              <div className="text-[10px] uppercase tracking-widest text-stone-400 font-mono-tag">
                {entries.length} {entries.length === 1 ? 'collection' : 'collections'} · {activeTests.length} tests
              </div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="w-9 h-9 rounded-lg border border-stone-200 hover:border-stone-400 flex items-center justify-center transition"
              title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
            </button>
            <button onClick={() => setView('entry')} className="bg-stone-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-stone-800 transition flex items-center gap-2">
              <Icon name="plus" className="w-4 h-4" /> New
            </button>
          </div>
        </div>
        <div className="hidden sm:flex max-w-6xl mx-auto px-4 sm:px-6 gap-1 -mb-px overflow-x-auto">
          {[
            { id: 'dashboard', label: 'Dashboard', icon: 'activity' },
            { id: 'trends', label: 'Trends', icon: 'trending-up' },
            { id: 'history', label: 'History', icon: 'calendar' },
          ].map(tab => (
            <button key={tab.id} onClick={() => { if (tab.id === 'trends') setSelectedTest(null); setView(tab.id); }}
              className={`px-4 py-2.5 text-xs uppercase tracking-wider font-mono-tag border-b-2 transition flex items-center gap-2 whitespace-nowrap ${
                view === tab.id ? 'border-stone-900 text-stone-900' : 'border-transparent text-stone-400 hover:text-stone-700'
              }`}>
              <Icon name={tab.icon} className="w-3.5 h-3.5" />
              {tab.label}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-6">
        {view === 'dashboard' && (
          <Dashboard activeTests={activeTests} allResults={allResults} entries={entries}
            onSelectTest={(key) => { setSelectedTest(key); setView('trends'); }}
            onNewEntry={() => setView('entry')}
            onExport={() => exportData(entries)}
            onImport={persist} />
        )}
        {view === 'entry' && (
          <EntryForm onSave={(entry) => { addEntry(entry); setView('dashboard'); }} onCancel={() => setView('dashboard')} />
        )}
        {view === 'trends' && (
          <Trends allResults={allResults} activeTests={activeTests} selectedTest={selectedTest} onSelectTest={setSelectedTest} />
        )}
        {view === 'history' && <History entries={entries} onDelete={deleteEntry} />}
      </main>

      {/* Bottom tab bar — mobile only */}
      <nav className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 flex justify-around items-stretch"
        style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
        {[
          { id: 'dashboard', label: 'Dashboard', icon: 'activity' },
          { id: 'trends', label: 'Trends', icon: 'trending-up' },
          { id: 'history', label: 'History', icon: 'calendar' },
        ].map(tab => (
          <button key={tab.id} onClick={() => { if (tab.id === 'trends') setSelectedTest(null); setView(tab.id); }}
            className={`flex-1 flex flex-col items-center justify-center gap-1 py-2.5 transition ${
              view === tab.id ? 'text-stone-900' : 'text-stone-400'
            }`}>
            <Icon name={tab.icon} className="w-5 h-5" strokeWidth={view === tab.id ? 2.5 : 2} />
            <span className={`text-[10px] font-mono-tag uppercase tracking-wider ${view === tab.id ? 'font-semibold' : ''}`}>{tab.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

// =====================================================================
// DASHBOARD
// =====================================================================
function Dashboard({ activeTests, allResults, entries, onSelectTest, onNewEntry, onExport, onImport }) {
  const abnormalCount = activeTests.filter(t => t.status !== 'normal').length;
  if (entries.length === 0) return <EmptyState onNewEntry={onNewEntry} onImport={onImport} />;

  // Load custom groups from localStorage
  const [customGroups, setCustomGroups] = useState(() => {
    try {
      const raw = localStorage.getItem(CUSTOM_GROUPS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  });
  const [showGroupEditor, setShowGroupEditor] = useState(false);
  const [editingGroup, setEditingGroup] = useState(null);

  const saveGroups = (groups) => {
    setCustomGroups(groups);
    try { localStorage.setItem(CUSTOM_GROUPS_KEY, JSON.stringify(groups)); } catch {}
  };

  // Build a map of testKey → { test, history } for quick lookup
  const testIndex = useMemo(() => {
    const idx = {};
    activeTests.forEach(t => {
      idx[t.testKey] = {
        test: t.test,
        result: t,
        history: allResults.filter(r => r.testKey === t.testKey)
      };
    });
    return idx;
  }, [activeTests, allResults]);

  // Data-point count per test key
  const countByKey = useMemo(() => {
    const map = {};
    allResults.forEach(r => { map[r.testKey] = (map[r.testKey] || 0) + 1; });
    return map;
  }, [allResults]);

  // Group active tests by panel, sorted within each panel by data-point count
  const byPanel = useMemo(() => {
    const groups = {};
    activeTests.forEach(t => {
      if (!groups[t.test.panelLabel]) groups[t.test.panelLabel] = [];
      groups[t.test.panelLabel].push(t.testKey);
    });
    Object.keys(groups).forEach(panel => {
      groups[panel].sort((a, b) => {
        const cb = (countByKey[b] || 0) - (countByKey[a] || 0);
        return cb !== 0 ? cb : testIndex[a].test.name.localeCompare(testIndex[b].test.name);
      });
    });
    return groups;
  }, [activeTests, countByKey, testIndex]);

  // All test keys available for custom group creation (any key in the data)
  const allTestKeys = useMemo(() => {
    return Object.keys(testIndex).sort((a, b) =>
      testIndex[a].test.name.localeCompare(testIndex[b].test.name)
    );
  }, [testIndex]);

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <StatCard label="Collections" value={entries.length} accent="stone" />
        <StatCard label="Tests Tracked" value={activeTests.length} accent="stone" />
        <StatCard label="Out of Range" value={abnormalCount} accent={abnormalCount > 0 ? 'amber' : 'emerald'} />
        <StatCard label="Latest" value={fmtDateShort(
          entries.reduce((latest, e) => !latest || new Date(e.date) > new Date(latest) ? e.date : latest, null)
        )} accent="stone" small />
      </div>

      {/* Custom Groups */}
      {customGroups.map(group => {
        const tests = group.testKeys.filter(k => testIndex[k]).sort((a, b) => {
          const cb = (countByKey[b] || 0) - (countByKey[a] || 0);
          return cb !== 0 ? cb : testIndex[a].test.name.localeCompare(testIndex[b].test.name);
        });
        if (tests.length === 0) return null;
        return (
          <GroupSection
            key={'custom-' + group.id}
            label={group.name}
            badge="CUSTOM"
            testKeys={tests}
            testIndex={testIndex}
            onSelectTest={onSelectTest}
            onEdit={() => { setEditingGroup(group); setShowGroupEditor(true); }}
            onDelete={() => {
              if (confirm(`Delete group "${group.name}"?`)) {
                saveGroups(customGroups.filter(g => g.id !== group.id));
              }
            }}
          />
        );
      })}

      {/* Built-in Panels */}
      {Object.entries(byPanel).map(([panelLabel, testKeys]) => (
        <GroupSection
          key={'panel-' + panelLabel}
          label={panelLabel}
          testKeys={testKeys}
          testIndex={testIndex}
          onSelectTest={onSelectTest}
        />
      ))}

      <div className="pt-4 flex flex-wrap gap-2">
        <button onClick={() => { setEditingGroup(null); setShowGroupEditor(true); }}
          className="text-xs font-mono-tag uppercase tracking-wider text-stone-700 hover:text-stone-900 px-3 py-2 border border-stone-300 rounded-lg flex items-center gap-2">
          <Icon name="plus" className="w-3.5 h-3.5" /> New Custom Group
        </button>
        <button onClick={onExport} className="text-xs font-mono-tag uppercase tracking-wider text-stone-500 hover:text-stone-900 px-3 py-2 border border-stone-200 rounded-lg flex items-center gap-2">
          <Icon name="download" className="w-3.5 h-3.5" /> Export JSON
        </button>
        <ImportButton onImport={onImport} />
      </div>

      {showGroupEditor && (
        <GroupEditor
          group={editingGroup}
          allTestKeys={allTestKeys}
          testIndex={testIndex}
          onSave={(group) => {
            if (editingGroup) {
              saveGroups(customGroups.map(g => g.id === group.id ? group : g));
            } else {
              saveGroups([...customGroups, { ...group, id: Date.now() }]);
            }
            setShowGroupEditor(false);
            setEditingGroup(null);
          }}
          onCancel={() => { setShowGroupEditor(false); setEditingGroup(null); }}
        />
      )}
    </div>
  );
}

function GroupSection({ label, badge, testKeys, testIndex, onSelectTest, onEdit, onDelete }) {
  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <h2 className="text-xs uppercase tracking-widest font-mono-tag text-stone-500">{label}</h2>
        {badge && <span className="text-[9px] font-mono-tag uppercase tracking-wider px-1.5 py-0.5 rounded bg-stone-900 text-white">{badge}</span>}
        <div className="flex-1 h-px bg-stone-200" />
        {onEdit && (
          <button onClick={onEdit} className="text-[10px] font-mono-tag uppercase tracking-wider text-stone-400 hover:text-stone-900">edit</button>
        )}
        {onDelete && (
          <button onClick={onDelete} className="text-[10px] font-mono-tag uppercase tracking-wider text-stone-400 hover:text-rose-600">delete</button>
        )}
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
        {testKeys.map(key => {
          const entry = testIndex[key];
          if (!entry) return null;
          return (
            <MiniChart
              key={key}
              test={entry.test}
              result={entry.result}
              history={entry.history}
              onClick={() => onSelectTest(key)}
            />
          );
        })}
      </div>
    </div>
  );
}

function MiniChart({ test, result, history, onClick }) {
  const { value, status, date } = result;
  const statusBorder = {
    normal: 'border-stone-200',
    high: 'border-amber-300',
    low: 'border-blue-300',
  };
  const lineColour = status === 'normal' ? '#10b981' : status === 'high' ? '#f59e0b' : '#3b82f6';

  // Chronological data for chart
  const chartData = [...history].reverse().map(h => ({ date: h.date, value: h.value }));

  // Reference range as a band (only when both bounds defined)
  const refMin = test.low;
  const refMax = test.high;

  return (
    <button onClick={onClick}
      className={`text-left rounded-lg border bg-white p-3 hover:shadow-md transition ${statusBorder[status]}`}>
      <div className="text-[11px] font-medium truncate text-stone-600" title={test.name}>{test.name}</div>
      <div className="mt-1.5 flex items-end gap-3">
        <div className="flex items-baseline gap-1 flex-shrink-0">
          <span className={`font-bold tabular-nums font-serif-display leading-none ${test.qualitative ? 'text-sm' : 'text-xl'}`}>{formatValue(test, value)}</span>
          {!test.qualitative && <span className="text-[9px] text-stone-400 font-mono-tag">{test.unit}</span>}
        </div>
        <div className="h-10 flex-1 min-w-0">
          {chartData.length >= 2 ? (
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={chartData} margin={{ top: 2, right: 2, bottom: 2, left: 2 }}>
                {refMin != null && refMax != null && (
                  <ReferenceArea y1={refMin} y2={refMax} fill="#10b981" fillOpacity={0.06} stroke="none" />
                )}
                <Line type="monotone" dataKey="value" stroke={lineColour} strokeWidth={1.5} dot={{ r: 1.5, fill: lineColour }} />
                <YAxis hide domain={['auto', 'auto']} />
              </LineChart>
            </ResponsiveContainer>
          ) : null}
        </div>
      </div>
    </button>
  );
}

function GroupEditor({ group, allTestKeys, testIndex, onSave, onCancel }) {
  const [name, setName] = useState(group?.name || '');
  const [selected, setSelected] = useState(new Set(group?.testKeys || []));
  const [search, setSearch] = useState('');

  const toggle = (key) => {
    const next = new Set(selected);
    if (next.has(key)) next.delete(key); else next.add(key);
    setSelected(next);
  };

  const filteredKeys = allTestKeys.filter(k => {
    if (!search) return true;
    const s = search.toLowerCase();
    return testIndex[k].test.name.toLowerCase().includes(s) || k.toLowerCase().includes(s);
  });

  const canSave = name.trim().length > 0 && selected.size > 0;

  return (
    <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-2xl max-h-[90vh] flex flex-col">
        <div className="p-4 border-b border-stone-200">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-medium font-serif-display">{group ? 'Edit Group' : 'New Custom Group'}</h2>
            <button onClick={onCancel} className="text-stone-400 hover:text-stone-900">
              <Icon name="x" className="w-5 h-5" />
            </button>
          </div>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="Group name (e.g. Inflammation, Recovery markers)"
            className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tests..."
            className="w-full mt-2 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-xs focus:outline-none focus:border-stone-900" />
          <div className="text-[10px] font-mono-tag uppercase tracking-wider text-stone-400 mt-2">
            {selected.size} test{selected.size === 1 ? '' : 's'} selected
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-3">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
            {filteredKeys.map(key => {
              const t = testIndex[key].test;
              const isSelected = selected.has(key);
              return (
                <button key={key} onClick={() => toggle(key)}
                  className={`text-left px-3 py-2 rounded-lg border text-xs flex items-center gap-2 transition ${
                    isSelected ? 'border-stone-900 bg-stone-900 text-white' : 'border-stone-200 hover:border-stone-400'
                  }`}>
                  <div className={`w-3.5 h-3.5 rounded border flex-shrink-0 flex items-center justify-center ${
                    isSelected ? 'bg-white border-white' : 'border-stone-300'
                  }`}>
                    {isSelected && <Icon name="check" className="w-2.5 h-2.5 text-stone-900" />}
                  </div>
                  <span className="truncate flex-1">{t.name}</span>
                  <span className="text-[9px] font-mono-tag opacity-50 uppercase">{t.panelLabel}</span>
                </button>
              );
            })}
          </div>
        </div>
        <div className="p-4 border-t border-stone-200 flex gap-2">
          <button onClick={onCancel} className="flex-1 px-4 py-2 border border-stone-200 rounded-lg text-sm hover:bg-stone-50">Cancel</button>
          <button onClick={() => onSave({ id: group?.id, name: name.trim(), testKeys: Array.from(selected) })}
            disabled={!canSave}
            className="flex-1 px-4 py-2 bg-stone-900 text-white rounded-lg text-sm hover:bg-stone-700 disabled:opacity-30 disabled:cursor-not-allowed">
            Save Group
          </button>
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, accent = 'stone', small = false }) {
  const accents = { stone: 'text-stone-900', emerald: 'text-emerald-600', amber: 'text-amber-600' };
  return (
    <div className="bg-white border border-stone-200 rounded-xl p-4">
      <div className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400 mb-1">{label}</div>
      <div className={`${small ? 'text-base' : 'text-2xl'} font-bold ${accents[accent]} font-serif-display`}>{value}</div>
    </div>
  );
}

function TestCard({ result, history, onClick }) {
  const { test, value, status, date } = result;
  const trend = history.length >= 2 ? history[0].value - history[1].value : 0;
  const statusStyles = {
    normal: 'border-stone-200 bg-white',
    high: 'border-amber-300 bg-amber-50/50',
    low: 'border-blue-300 bg-blue-50/50',
  };
  const dotStyles = { normal: 'bg-emerald-500', high: 'bg-amber-500', low: 'bg-blue-500' };

  return (
    <button onClick={onClick} className={`text-left rounded-xl border p-4 hover:shadow-md transition group ${statusStyles[status]}`}>
      <div className="flex items-start justify-between mb-2">
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium truncate">{test.name}</div>
          <div className="text-[10px] uppercase tracking-wider font-mono-tag text-stone-400">{fmtDateShort(date)}</div>
        </div>
        <div className={`w-2 h-2 rounded-full ${dotStyles[status]} mt-1.5`} />
      </div>
      <div className="flex items-baseline gap-2">
        <span className={`font-bold tabular-nums font-serif-display ${test.qualitative ? 'text-base' : 'text-2xl'}`}>{formatValue(test, value)}</span>
        {!test.qualitative && <span className="text-xs text-stone-500 font-mono-tag">{test.unit}</span>}
      </div>
      <div className="text-[10px] font-mono-tag text-stone-400 mt-1">
        Ref: {test.low ?? '—'} – {test.high ?? '—'}
        {history.length >= 2 && (
          <span className={`ml-2 ${trend > 0 ? 'text-amber-600' : trend < 0 ? 'text-blue-600' : ''}`}>
            {trend > 0 ? '↑' : trend < 0 ? '↓' : '→'} {Math.abs(trend).toFixed(2)}
          </span>
        )}
      </div>
      {history.length >= 2 && (
        <div className="h-8 mt-2 -mx-1">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={[...history].reverse()}>
              <Line type="monotone" dataKey="value"
                stroke={status === 'normal' ? '#10b981' : status === 'high' ? '#f59e0b' : '#3b82f6'}
                strokeWidth={1.5} dot={false} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      )}
    </button>
  );
}

function EntryForm({ onSave, onCancel }) {
  const today = new Date().toISOString().split('T')[0];
  const [date, setDate] = useState(today);
  const [lab, setLab] = useState('');
  const [notes, setNotes] = useState('');
  const [context, setContext] = useState('');
  const [results, setResults] = useState({});
  const [activePanel, setActivePanel] = useState('FBC');
  const [search, setSearch] = useState('');
  const [mode, setMode] = useState('panel');

  const setValue = (key, val) => setResults(prev => ({ ...prev, [key]: val }));

  const filteredQuick = useMemo(() => {
    if (!search.trim()) return ALL_TESTS;
    const q = search.toLowerCase();
    return ALL_TESTS.filter(t =>
      t.name.toLowerCase().includes(q) || t.panelLabel.toLowerCase().includes(q) || t.key.toLowerCase().includes(q)
    );
  }, [search]);

  const filledCount = Object.values(results).filter(v => v !== '' && v !== null && v !== undefined).length;

  const handleSave = () => {
    const cleaned = {};
    Object.entries(results).forEach(([k, v]) => {
      if (v !== '' && v !== null && v !== undefined) cleaned[k] = v;
    });
    if (Object.keys(cleaned).length === 0) { alert('Add at least one result'); return; }
    onSave({ date, lab: lab.trim(), notes: notes.trim(), context: context.trim(), results: cleaned });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold font-serif-display">New Collection</h1>
        <button onClick={onCancel} className="p-2 hover:bg-stone-100 rounded-lg">
          <Icon name="x" className="w-5 h-5" />
        </button>
      </div>

      <div className="bg-white border border-stone-200 rounded-xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400">Date</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)}
            className="w-full mt-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
        </div>
        <div>
          <label className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400">Lab (optional)</label>
          <input value={lab} onChange={e => setLab(e.target.value)} placeholder="e.g. Douglass Hanly Moir"
            className="w-full mt-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
        </div>
        <div>
          <label className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400">Context</label>
          <select value={context} onChange={e => setContext(e.target.value)}
            className="w-full mt-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900">
            <option value="">— None —</option>
            <option value="Outpatient">Outpatient</option>
            <option value="Routine screening">Routine screening</option>
            <option value="Pre-employment">Pre-employment</option>
            <option value="ED presentation">ED presentation</option>
            <option value="Inpatient">Inpatient</option>
            <option value="Pre-op">Pre-op</option>
            <option value="Post-op">Post-op</option>
            <option value="Follow-up">Follow-up</option>
            <option value="Fasting">Fasting</option>
          </select>
        </div>
        <div>
          <label className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400">Notes</label>
          <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Free text"
            className="w-full mt-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
        </div>
      </div>

      <div className="flex gap-1 bg-stone-100 p-1 rounded-lg w-fit">
        <button onClick={() => setMode('panel')}
          className={`px-3 py-1.5 text-xs font-mono-tag uppercase tracking-wider rounded-md transition ${mode === 'panel' ? 'bg-white shadow-sm' : 'text-stone-500'}`}>
          By Panel
        </button>
        <button onClick={() => setMode('quick')}
          className={`px-3 py-1.5 text-xs font-mono-tag uppercase tracking-wider rounded-md transition ${mode === 'quick' ? 'bg-white shadow-sm' : 'text-stone-500'}`}>
          Quick Entry
        </button>
      </div>

      {mode === 'panel' && (
        <div className="bg-white border border-stone-200 rounded-xl overflow-hidden">
          <div className="border-b border-stone-200 overflow-x-auto">
            <div className="flex">
              {Object.entries(PANELS).map(([key, panel]) => {
                const filledInPanel = panel.tests.filter(t =>
                  results[t.key] !== '' && results[t.key] !== null && results[t.key] !== undefined
                ).length;
                return (
                  <button key={key} onClick={() => setActivePanel(key)}
                    className={`px-4 py-2.5 text-xs font-mono-tag uppercase tracking-wider border-b-2 whitespace-nowrap transition ${
                      activePanel === key ? 'border-stone-900 text-stone-900' : 'border-transparent text-stone-400 hover:text-stone-700'
                    }`}>
                    {key}
                    {filledInPanel > 0 && (
                      <span className="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-[10px] bg-emerald-100 text-emerald-700 rounded-full">
                        {filledInPanel}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="p-4">
            <div className="text-sm text-stone-500 mb-3 font-serif-display">{PANELS[activePanel].label}</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {PANELS[activePanel].tests.map(t => (
                <ResultInput key={t.key} test={t} value={results[t.key] || ''} onChange={v => setValue(t.key, v)} />
              ))}
            </div>

        </div>

      {mode === 'quick' && (
        <div className="bg-white border border-stone-200 rounded-xl p-4">
          <div className="relative mb-3">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400">
              <Icon name="search" className="w-4 h-4" />
            </span>
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Search any test (e.g. ferritin, TSH, ALT)…"
              className="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[500px] overflow-y-auto">
            {filteredQuick.map(t => (
              <ResultInput key={t.key} test={t} value={results[t.key] || ''} onChange={v => setValue(t.key, v)} showPanel />
            ))}
          </div>
        </div>
      )}

      <div className="sticky bottom-4 flex justify-between items-center bg-white border border-stone-200 rounded-xl p-3 shadow-lg">
        <div className="text-xs font-mono-tag text-stone-500">
          {filledCount} {filledCount === 1 ? 'result' : 'results'} entered
        </div>
        <div className="flex gap-2">
          <button onClick={onCancel} className="px-4 py-2 text-sm text-stone-600 hover:text-stone-900">Cancel</button>
          <button onClick={handleSave} disabled={filledCount === 0}
            className="bg-stone-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-stone-800 disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
            <Icon name="check" className="w-4 h-4" /> Save
          </button>
        </div>
      </div>
    </div>
  );
}

function ResultInput({ test, value, onChange, showPanel = false }) {
  const status = flagStatus(value, test);
  const borderClass = {
    normal: 'border-stone-200 focus-within:border-stone-900',
    high: 'border-amber-400 bg-amber-50/30',
    low: 'border-blue-400 bg-blue-50/30',
  }[status];

  return (
    <div className={`border rounded-lg px-3 py-2 transition ${borderClass}`}>
      <div className="flex items-center justify-between">
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium truncate">{test.name}</div>
          <div className="text-[10px] font-mono-tag text-stone-400">
            {showPanel && <span className="mr-2">{test.panelLabel}</span>}
            {test.qualitative
              ? `${QUALITATIVE_SCHEMES[test.qualitative].neg} / ${QUALITATIVE_SCHEMES[test.qualitative].pos}`
              : `Ref: ${test.low ?? '—'}–${test.high ?? '—'} ${test.unit}`}
          </div>
        </div>
        <div className="flex items-center gap-2">
          {test.qualitative ? (
            <select value={value} onChange={e => onChange(e.target.value)}
              className="text-sm font-medium bg-transparent focus:outline-none font-serif-display border border-stone-200 rounded px-2 py-1">
              <option value="">—</option>
              <option value="0">{QUALITATIVE_SCHEMES[test.qualitative].neg}</option>
              <option value="1">{QUALITATIVE_SCHEMES[test.qualitative].pos}</option>
            </select>
          ) : (
            <input type="number" step="any" inputMode="decimal" value={value} onChange={e => onChange(e.target.value)}
              placeholder="—"
              className="w-20 text-right tabular-nums bg-transparent text-base font-medium focus:outline-none font-serif-display" />
          )}
          {status === 'high' && <Icon name="alert-triangle" className="w-3.5 h-3.5 text-amber-500" />}
          {status === 'low' && <Icon name="alert-triangle" className="w-3.5 h-3.5 text-blue-500" />}
        </div>
      </div>
    </div>
  );
}

// TRENDS
// =====================================================================
function Trends({ allResults, activeTests, selectedTest, onSelectTest }) {
  const [search, setSearch] = useState('');
  const [expandedPanels, setExpandedPanels] = useState({});
  const current = selectedTest;  // only set when user explicitly picks a test
  const test = current ? findTest(current) : null;

  const series = useMemo(() => {
    if (!current) return [];
    return allResults.filter(r => r.testKey === current)
      .sort((a, b) => new Date(a.date) - new Date(b.date))
      .map(r => ({ date: r.date, dateLabel: fmtDateShort(r.date), value: r.value, status: r.status, lab: r.lab || 'Unspecified' }));
  }, [current, allResults]);

  // Build a stable colour palette for labs (across all data, not just current series)
  const labColours = useMemo(() => {
    const palette = ['#0ea5e9', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#84cc16', '#6366f1', '#eab308'];
    const labs = Array.from(new Set(allResults.map(r => r.lab || 'Unspecified'))).sort();
    const map = {};
    labs.forEach((lab, i) => { map[lab] = palette[i % palette.length]; });
    return map;
  }, [allResults]);

  // Labs present in current series, in chronological order of first appearance
  const labsInSeries = useMemo(() => {
    const seen = new Set();
    const order = [];
    series.forEach(s => {
      if (!seen.has(s.lab)) { seen.add(s.lab); order.push(s.lab); }
    });
    return order;
  }, [series]);

  // Data point count per test — for ordering by "most used"
  const countByKey = useMemo(() => {
    const map = {};
    allResults.forEach(r => { map[r.testKey] = (map[r.testKey] || 0) + 1; });
    return map;
  }, [allResults]);

  // Tests grouped by panel, each panel sorted by data-point count (desc), then name
  const testsByPanel = useMemo(() => {
    const groups = {};
    activeTests.forEach(t => {
      const panel = t.test.panelLabel;
      if (!groups[panel]) groups[panel] = [];
      groups[panel].push(t);
    });
    Object.keys(groups).forEach(panel => {
      groups[panel].sort((a, b) => {
        const cb = (countByKey[b.testKey] || 0) - (countByKey[a.testKey] || 0);
        return cb !== 0 ? cb : a.test.name.localeCompare(b.test.name);
      });
    });
    return groups;
  }, [activeTests, countByKey]);

  // Filter by search (across name and panel label)
  const filteredByPanel = useMemo(() => {
    if (!search.trim()) return testsByPanel;
    const q = search.toLowerCase();
    const out = {};
    Object.entries(testsByPanel).forEach(([panel, tests]) => {
      const matched = tests.filter(t =>
        t.test.name.toLowerCase().includes(q) || panel.toLowerCase().includes(q)
      );
      if (matched.length) out[panel] = matched;
    });
    return out;
  }, [search, testsByPanel]);

  if (activeTests.length === 0) {
    return <div className="text-center py-16 text-stone-400 font-mono-tag text-sm">No data yet — add a collection first</div>;
  }

  // ─── LIST VIEW (no test selected) ──────────────────────────────────────
  if (!current) {
    return (
      <div className="space-y-3">
        <div className="bg-white border border-stone-200 rounded-xl p-3">
          <div className="relative">
            <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-400">
              <Icon name="search" className="w-4 h-4" />
            </span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tests…"
              className="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
          </div>
        </div>

        {Object.entries(filteredByPanel).sort((a, b) => a[0].localeCompare(b[0])).map(([panel, tests]) => {
          const isExpanded = expandedPanels[panel] || !!search.trim();
          return (
            <div key={panel} className="bg-white border border-stone-200 rounded-xl overflow-hidden">
              <button onClick={() => setExpandedPanels({...expandedPanels, [panel]: !isExpanded})}
                className="w-full px-4 py-3 flex items-center justify-between hover:bg-stone-50 transition border-b border-stone-100">
                <div className="flex items-center gap-2">
                  <Icon name={isExpanded ? 'chevron-down' : 'chevron-right'} className="w-4 h-4 text-stone-400" />
                  <span className="text-xs uppercase tracking-widest font-mono-tag text-stone-500">{panel}</span>
                </div>
                <span className="text-[10px] font-mono-tag text-stone-400">{tests.length} test{tests.length === 1 ? '' : 's'}</span>
              </button>
              {isExpanded && (
                <div>
                  {tests.map(t => {
                    const count = countByKey[t.testKey] || 0;
                    const latest = t;
                    return (
                      <button key={t.testKey} onClick={() => onSelectTest(t.testKey)}
                        className="w-full px-4 py-2.5 flex items-center gap-3 hover:bg-stone-50 transition border-b border-stone-50 last:border-b-0 text-left">
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium truncate">{t.test.name}</div>
                          <div className="text-[10px] font-mono-tag text-stone-400 mt-0.5">
                            {count} result{count === 1 ? '' : 's'}
                            {t.test.unit && ` · ${t.test.unit}`}
                          </div>
                        </div>
                        <div className="text-right flex-shrink-0">
                          <div className={`text-sm font-bold tabular-nums font-serif-display ${
                            latest.status === 'high' ? 'text-amber-600' :
                            latest.status === 'low' ? 'text-blue-600' : 'text-stone-700'
                          }`}>{formatValue(t.test, latest.value)}</div>
                        </div>
                        <Icon name="chevron-right" className="w-4 h-4 text-stone-300 flex-shrink-0" />
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {Object.keys(filteredByPanel).length === 0 && (
          <div className="text-center py-12 text-stone-400 font-mono-tag text-sm">No tests match "{search}"</div>
        )}
      </div>
    );
  }

  // ─── CHART VIEW (test selected) ─────────────────────────────────────────
  return (
    <div className="space-y-4">
      {/* Back button + breadcrumb */}
      <button onClick={() => onSelectTest(null)}
        className="flex items-center gap-2 text-xs font-mono-tag uppercase tracking-wider text-stone-500 hover:text-stone-900 transition">
        <Icon name="chevron-left" className="w-4 h-4" />
        Back to all tests
      </button>

      <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-6">
        {test && (
          <>
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="text-2xl font-bold font-serif-display">{test.name}</h2>
              {!test.qualitative && <div className="text-xs font-mono-tag text-stone-400 uppercase tracking-wider">{test.unit}</div>}
            </div>
            <div className="text-xs font-mono-tag text-stone-400 mb-4">
              {test.panelLabel}
              {test.qualitative
                ? ` · ${QUALITATIVE_SCHEMES[test.qualitative].neg} / ${QUALITATIVE_SCHEMES[test.qualitative].pos}`
                : ` · Reference: ${test.low ?? '—'}–${test.high ?? '—'} ${test.unit}`}
            </div>
            {series.length === 1 && (
              <div className="text-xs text-stone-400 mb-2 font-mono-tag">Single data point — add more to see trend</div>
            )}
            <div className="h-72 -ml-4">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={series} margin={{ top: 20, right: 16, bottom: 8, left: 16 }}>
                  <CartesianGrid stroke="#e7e5e4" strokeDasharray="3 3" vertical={false} />
                  <XAxis dataKey="dateLabel" tick={{ fontSize: 10, fill: '#a8a29e', fontFamily: 'monospace' }}
                    axisLine={{ stroke: '#e7e5e4' }} tickLine={false} />
                  <YAxis tick={{ fontSize: 10, fill: '#a8a29e', fontFamily: 'monospace' }}
                    axisLine={false} tickLine={false}
                    domain={test.qualitative ? [-0.2, 1.2] : ['auto', 'auto']}
                    ticks={test.qualitative ? [0, 1] : undefined}
                    tickFormatter={test.qualitative
                      ? (v) => v === 1 ? QUALITATIVE_SCHEMES[test.qualitative].pos : v === 0 ? QUALITATIVE_SCHEMES[test.qualitative].neg : ''
                      : undefined
                    } />
                  <Tooltip
                    cursor={{ stroke: '#a8a29e', strokeWidth: 1, strokeDasharray: '3 3' }}
                    contentStyle={{
                      background: document.documentElement.classList.contains('dark') ? '#fafaf9' : '#1c1917',
                      border: 'none', borderRadius: 8,
                      fontSize: 12, fontFamily: 'monospace',
                      color: document.documentElement.classList.contains('dark') ? '#1c1917' : '#fafaf9',
                      padding: '8px 12px'
                    }}
                    labelStyle={{
                      color: document.documentElement.classList.contains('dark') ? '#57534e' : '#a8a29e',
                      fontSize: 10, textTransform: 'uppercase', marginBottom: 4
                    }}
                    itemStyle={{
                      color: document.documentElement.classList.contains('dark') ? '#1c1917' : '#fafaf9',
                      padding: 0
                    }}
                    formatter={(val, _name, item) => {
                      const lab = item?.payload?.lab;
                      const display = test.qualitative
                        ? formatValue(test, val)
                        : `${val}${test.unit ? ' ' + test.unit : ''}`;
                      return [`${display}${lab ? ` · ${lab}` : ''}`, test.name];
                    }} />
                  {test.low !== null && test.high !== null && (
                    <ReferenceArea y1={test.low} y2={test.high} fill="#10b981" fillOpacity={0.08} />
                  )}
                  {test.low !== null && (
                    <ReferenceLine y={test.low} stroke="#10b981" strokeDasharray="4 4" strokeOpacity={0.5} />
                  )}
                  {test.high !== null && (
                    <ReferenceLine y={test.high} stroke="#10b981" strokeDasharray="4 4" strokeOpacity={0.5} />
                  )}
                  <Line type="monotone" dataKey="value" stroke={document.documentElement.classList.contains('dark') ? '#fafaf9' : '#1c1917'} strokeWidth={2}
                    isAnimationActive={false}
                    activeDot={{ r: 8, strokeWidth: 0, fill: '#10b981' }}
                    dot={(props) => {
                      const { cx, cy, payload, index } = props;
                      const labColour = labColours[payload.lab] || '#78716c';
                      const statusRing = payload.status === 'normal' ? '#10b981' :
                                         payload.status === 'high' ? '#f59e0b' : '#3b82f6';
                      return (
                        <circle key={`dot-${index}`} cx={cx} cy={cy} r={6} fill={labColour} stroke={statusRing} strokeWidth={2.5} />
                      );
                    }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
            {/* Legend */}
            {labsInSeries.length > 0 && (
              <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-[10px] font-mono-tag uppercase tracking-wider text-stone-500">
                <div className="flex items-center gap-3">
                  <span className="text-stone-400">Lab:</span>
                  {labsInSeries.map(lab => (
                    <span key={lab} className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: labColours[lab] }} />
                      {lab}
                    </span>
                  ))}
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-stone-400">Status (ring):</span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-stone-300" style={{ boxShadow: 'inset 0 0 0 2px #10b981' }} />
                    Normal
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-stone-300" style={{ boxShadow: 'inset 0 0 0 2px #f59e0b' }} />
                    High
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-stone-300" style={{ boxShadow: 'inset 0 0 0 2px #3b82f6' }} />
                    Low
                  </span>
                </div>
              </div>
            )}
            <div className="mt-6 border-t border-stone-100 pt-4">
              <div className="text-[10px] uppercase tracking-widest font-mono-tag text-stone-400 mb-2">
                All values ({series.length})
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                {[...series].reverse().map((s, i) => (
                  <div key={i} className="px-3 py-2 bg-stone-50 rounded-lg">
                    <div className="flex items-center justify-between gap-2">
                      <div className="text-[10px] font-mono-tag text-stone-400">{fmtDate(s.date)}</div>
                      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: labColours[s.lab] }} title={s.lab} />
                    </div>
                    <div className="flex items-baseline gap-1">
                      <span className={`font-bold tabular-nums font-serif-display ${test.qualitative ? 'text-xs' : 'text-base'}`}>{formatValue(test, s.value)}</span>
                      <span className={`text-[10px] font-mono-tag ${
                        s.status === 'high' ? 'text-amber-600' : s.status === 'low' ? 'text-blue-600' : 'text-emerald-600'
                      }`}>
                        {s.status === 'high' ? 'H' : s.status === 'low' ? 'L' : '✓'}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// HISTORY
// =====================================================================
function History({ entries, onDelete }) {
  if (entries.length === 0) {
    return <div className="text-center py-16 text-stone-400 font-mono-tag text-sm">No collections yet</div>;
  }
  const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));

  return (
    <div className="space-y-3">
      {sorted.map(entry => {
        const resultCount = Object.keys(entry.results || {}).length;
        const abnormal = Object.entries(entry.results || {}).filter(([k, v]) => {
          const t = findTest(k);
          if (!t) return false;
          return flagStatus(v, t) !== 'normal';
        }).length;

        return (
          <div key={entry.id} className="bg-white border border-stone-200 rounded-xl overflow-hidden">
            <div className="px-4 py-3 border-b border-stone-100 flex items-center justify-between">
              <div>
                <div className="font-medium font-serif-display flex items-center gap-2">
                  {fmtDate(entry.date)}
                  {entry.context && (
                    <span className="text-[10px] font-mono-tag uppercase tracking-wider px-2 py-0.5 rounded bg-stone-900 text-white">
                      {entry.context}
                    </span>
                  )}
                </div>
                <div className="text-[10px] font-mono-tag uppercase tracking-wider text-stone-400">
                  {resultCount} results · {abnormal} flagged
                  {entry.lab && ` · ${entry.lab}`}
                  {entry.notes && ` · ${entry.notes}`}
                </div>
              </div>
              <button onClick={() => { if (confirm('Delete this collection?')) onDelete(entry.id); }}
                className="p-1.5 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded">
                <Icon name="trash-2" className="w-4 h-4" />
              </button>
            </div>
            <div className="p-4 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2">
              {Object.entries(entry.results).map(([key, value]) => {
                const t = findTest(key);
                if (!t) return null;
                const status = flagStatus(value, t);
                return (
                  <div key={key} className={`px-3 py-2 rounded-lg border ${
                    status === 'normal' ? 'border-stone-100 bg-stone-50' :
                    status === 'high' ? 'border-amber-200 bg-amber-50' : 'border-blue-200 bg-blue-50'
                  }`}>
                    <div className="text-[10px] font-mono-tag text-stone-500 truncate">{t.name}</div>
                    <div className="flex items-baseline gap-1">
                      <span className={`font-bold tabular-nums font-serif-display ${t.qualitative ? 'text-xs' : 'text-sm'}`}>{formatValue(t, value)}</span>
                      {!t.qualitative && <span className="text-[10px] font-mono-tag text-stone-400">{t.unit}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// =====================================================================
// EMPTY / IMPORT / EXPORT
// =====================================================================
function EmptyState({ onNewEntry, onImport }) {
  return (
    <div className="text-center py-16">
      <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-stone-900 flex items-center justify-center">
        <Icon name="activity" className="w-8 h-8 text-emerald-400" strokeWidth={2} />
      </div>
      <h2 className="text-3xl font-bold mb-2 font-serif-display">Start tracking</h2>
      <p className="text-stone-500 text-sm max-w-md mx-auto mb-6">
        Add your first lab collection. Pre-loaded with FBC, UEC, LFTs, lipids, TFTs, iron, coags, HbA1c, vit D, B12, calprotectin and more.
      </p>
      <div className="flex gap-2 justify-center flex-wrap">
        <button onClick={onNewEntry}
          className="bg-stone-900 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-stone-800 flex items-center gap-2">
          <Icon name="plus" className="w-4 h-4" /> New collection
        </button>
        <ImportButton onImport={onImport} />
      </div>
    </div>
  );
}

function ImportButton({ onImport }) {
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('Invalid format');
        if (confirm(`Import ${data.length} collections? This will replace existing data.`)) onImport(data);
      } catch (err) { alert('Could not parse file: ' + err.message); }
    };
    reader.readAsText(file);
  };
  return (
    <label className="text-xs font-mono-tag uppercase tracking-wider text-stone-500 hover:text-stone-900 px-3 py-2 border border-stone-200 rounded-lg flex items-center gap-2 cursor-pointer">
      <Icon name="upload" className="w-3.5 h-3.5" /> Import JSON
      <input type="file" accept=".json" onChange={handleFile} className="hidden" />
    </label>
  );
}

function exportData(entries) {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lab-data-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Mount
ReactDOM.createRoot(document.getElementById('root')).render(<LabTracker />);
</script>
</body>
</html>
